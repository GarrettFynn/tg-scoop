name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装（tgcrypto 仅 golden 生成器需要，CI 不装）
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest>=8.0 ruff==0.16.3
      - name: ruff
        run: ruff check src tests
      - name: pytest
        run: pytest tests/ -q

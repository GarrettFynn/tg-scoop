name: release

on:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装构建依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - name: 质量门禁（先测后包）
        run: |
          pip install pytest>=8.0 ruff==0.16.3
          ruff check src tests
          pytest tests/ -q
      - name: 构建绿色 zip
        run: python packaging/build_zip.py --version ${{ github.ref_name }}
      - name: 上传 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tg-scoop-${{ github.ref_name }}-windows-x64.zip
          generate_release_notes: false
